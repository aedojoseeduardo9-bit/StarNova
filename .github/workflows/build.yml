# Star Nova (Godot 4.7, carpeta godot/): prueba el juego con "los ojos" (capturas + pruebas de los 3 mundos) y
# compila las apps: Android, Mac (universal: Intel y Apple), Windows, Linux y el proyecto de Xcode para iPhone/iPad.
# En ramas solo prueba y compila; en main publica todo en el release "latest" (enlace fijo de StarNova.apk).
name: Compilar Star Nova
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.7"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Godot y plantillas de exportación (caché)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Descargar Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="$GODOT_VERSION-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates/$GODOT_VERSION.stable
          curl -sSL -f -o g.zip "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip"
          unzip -q g.zip -d ~/godot && rm g.zip
          curl -sSL -f -o t.tpz "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz"
          unzip -q t.tpz -d tpl && mv tpl/templates/* ~/.local/share/godot/export_templates/$GODOT_VERSION.stable/ && rm -rf t.tpz tpl

      - name: Pantalla virtual y OpenGL por software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 qrencode
          echo "GODOT=$(ls ~/godot/Godot_v*_linux.x86_64)" >> "$GITHUB_ENV"

      - name: Los ojos (capturas y pruebas)
        run: bash godot/tools/ojos.sh "$GODOT" ojos

      - name: Publicar capturas (release diagnostico)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d ojos ] || exit 0
          (cd ojos && ls *.png > /dev/null 2>&1 && zip -q capturas.zip *.png)
          gh release delete diagnostico --yes --cleanup-tag || true
          gh release delete diagnostico-nativo --yes --cleanup-tag || true
          F="ojos/report.txt"; [ -f ojos/capturas.zip ] && F="$F ojos/capturas.zip"
          gh release create diagnostico $F ojos/*.png \
            --title "Diagnóstico (ojos) · ${GITHUB_REF_NAME}" --notes "Capturas y pruebas automáticas de los 3 mundos." \
            --prerelease --latest=false --target "$(git rev-parse HEAD)" || true

      - name: Java 17 y Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # La llave de firma (Secrets o caché privada del repositorio); nunca va en el repositorio.
      # Es la misma de siempre: así la app nueva se instala encima de la que ya tiene el jugador.
      - name: Recuperar llave de firma (caché privada)
        uses: actions/cache@v4
        with:
          path: ~/.starnova-signing
          key: starnova-signing-v1

      - name: Preparar firma y número de compilación
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          D="$HOME/.starnova-signing"
          mkdir -p "$D"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$D/secret.jks"; KS="$D/secret.jks"; P="$KS_PASS"; A="${KS_ALIAS:-starnova}"
          else
            if [ ! -f "$D/release.jks" ]; then
              openssl rand -hex 16 > "$D/pass.txt"
              keytool -genkeypair -keystore "$D/release.jks" -storepass "$(cat "$D/pass.txt")" -keypass "$(cat "$D/pass.txt")" \
                -alias starnova -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Star Nova, O=nioro, C=CL"
            fi
            KS="$D/release.jks"; P="$(cat "$D/pass.txt")"; A="starnova"
          fi
          echo "::add-mask::$P"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$A"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$P"
          } >> "$GITHUB_ENV"
          S="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          sed -i "s#^export/android/android_sdk_path = .*#export/android/android_sdk_path = \"$ANDROID_HOME\"#" "$S"
          sed -i "s#^export/android/java_sdk_path = .*#export/android/java_sdk_path = \"$JAVA_HOME\"#" "$S"
          grep -q "^export/android/android_sdk_path" "$S" || echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$S"
          # número de compilación (la app lo compara con el título del release "latest" para ofrecer "Actualizar")
          N="${GITHUB_RUN_NUMBER}"
          sed -i "s/^config\/build=.*/config\/build=$N/" godot/project.godot
          sed -i "s/^version\/code=.*/version\/code=$(( $(date +%s) / 60 ))/" godot/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.8.$N\"/" godot/export_presets.cfg
          sed -i "s/^application\/short_version=.*/application\/short_version=\"0.8.$N\"/; s/^application\/version=.*/application\/version=\"0.8.$N\"/" godot/export_presets.cfg

      - name: Exportar Android, Mac, Windows, Linux e iOS (proyecto de Xcode)
        run: |
          cd godot
          mkdir -p build/linux build/windows build/macos build/android build/ios
          for P in Android Linux Windows macOS iOS; do
            case $P in
              Linux) OUT=build/linux/StarNova.x86_64 ;;
              Windows) OUT=build/windows/StarNova.exe ;;
              macOS) OUT=build/macos/StarNova_Mac.zip ;;
              Android) OUT=build/android/StarNova.apk ;;
              iOS) OUT=build/ios/StarNova.ipa ;;
            esac
            "$GODOT" --headless --path . --export-release "$P" "$OUT" 2>&1 | tee "build/export_$P.log"
            CHK="$OUT"; [ "$P" = iOS ] && CHK=build/ios/StarNova.pck
            [ -s "$CHK" ] || { echo "::error::No se pudo exportar $P"; grep -E "ERROR|error" "build/export_$P.log" | head -20; exit 1; }
          done
          ls -la build/*/

      - name: Empaquetar
        run: |
          mkdir -p dist
          cp godot/build/android/StarNova.apk dist/
          cp godot/build/macos/StarNova_Mac.zip dist/
          (cd godot/build/linux && zip -q -9 ../../../dist/StarNova_Linux.zip StarNova.x86_64)
          (cd godot/build/windows && zip -q -9 ../../../dist/StarNova_Windows.zip StarNova.exe)
          cp godot/IPHONE.md godot/build/ios/LEEME_IPHONE.md
          (cd godot/build && zip -q -r -9 ../../dist/StarNova_iOS_Xcode.zip ios)
          qrencode -o dist/qr.png -s 14 -m 3 "https://github.com/${{ github.repository }}/releases/latest/download/StarNova.apk"
          ls -la dist

      - name: Guardar compilaciones (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: starnova
          path: dist/
          retention-days: 14

      - name: Publicar release "latest" (solo main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for R in latest nativo build-error; do gh release delete "$R" --yes --cleanup-tag || true; done
          gh release create latest dist/* \
            --title "Star Nova 0.8 (compilación ${GITHUB_RUN_NUMBER})" \
            --notes "Android: StarNova.apk (se instala encima de la versión anterior y recupera sus partidas). Mac: StarNova_Mac.zip (Intel y Apple). Windows: StarNova_Windows.zip. Linux: StarNova_Linux.zip. iPhone/iPad: StarNova_iOS_Xcode.zip (proyecto de Xcode; ver LEEME_IPHONE.md dentro)." \
            --latest --target "$(git rev-parse HEAD)"
